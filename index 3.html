<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>「〜効果」4択クイズ 50問版</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:#f3f4f6;color:#222}
.container{max-width:720px;margin:0 auto;padding:24px 16px 40px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
h1{font-size:24px;margin:0 0 8px}.subtitle{color:#666;margin-bottom:20px}
.progress{font-weight:bold;color:#555;margin-bottom:14px}
.question{font-size:20px;font-weight:bold;line-height:1.65;margin-bottom:20px}
.option{width:100%;border:2px solid #ddd;background:#fff;border-radius:12px;padding:14px;margin:9px 0;text-align:left;font-size:16px;cursor:pointer;transition:.15s}
.option:hover:not(:disabled){border-color:#888;background:#fafafa}.option:disabled{cursor:default}
.option.correct{border-color:#28a745;background:#eaf7ed}.option.wrong{border-color:#dc3545;background:#fdecee}
.feedback{margin-top:18px;padding:15px;border-radius:12px;background:#f7f7f7;line-height:1.65}
.next,.restart{width:100%;border:none;border-radius:12px;padding:14px;margin-top:16px;font-size:16px;font-weight:bold;cursor:pointer;background:#222;color:#fff}
.next:hover,.restart:hover{opacity:.85}.result{text-align:center}.score{font-size:42px;font-weight:bold;margin:18px 0}
.small{color:#777;font-size:14px;line-height:1.6}
@media(max-width:480px){.card{padding:18px}h1{font-size:21px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="container"><div class="card" id="app"></div></div>
<script>
const questionBank = [{"q": "他人から期待されることで、その期待に沿うように実際の成績や行動が向上する現象を何という？", "a": "ピグマリオン効果", "choices": ["ピグマリオン効果", "ハロー効果", "プラセボ効果", "傍観者効果"], "explain": "周囲から高い期待をかけられることで、本人の成績や行動が実際に向上することがある現象です。"}, {"q": "ある人物の一つの目立った特徴に引きずられ、他の評価まで同じ方向に判断してしまう傾向を何という？", "a": "ハロー効果", "choices": ["ハロー効果", "単純接触効果", "ツァイガルニク効果", "ヴェブレン効果"], "explain": "一つの好印象・悪印象が、人物全体の評価に影響する現象です。"}, {"q": "中途半端に終わった作業や未完了の課題のほうが、完了した課題よりも記憶に残りやすい現象を何という？", "a": "ツァイガルニク効果", "choices": ["ツァイガルニク効果", "フレーミング効果", "ピグマリオン効果", "スポットライト効果"], "explain": "未完了の課題は心理的な緊張が残り、記憶に残りやすくなるとされます。"}, {"q": "ある対象に何度も接触するだけで、その対象への好意や親近感が高まりやすくなる現象を何という？", "a": "単純接触効果", "choices": ["単純接触効果", "プラセボ効果", "ハロー効果", "傍観者効果"], "explain": "繰り返し見たり聞いたりすることで、対象への好意が高まりやすくなる現象です。"}, {"q": "同じ内容でも、提示の仕方や表現の枠組みによって判断が変わる現象を何という？", "a": "フレーミング効果", "choices": ["フレーミング効果", "ヴェブレン効果", "ダニング＝クルーガー効果", "単純接触効果"], "explain": "情報そのものが同じでも、「成功率90％」と「失敗率10％」のように表現を変えると判断が変わることがあります。"}, {"q": "能力が低い人ほど自分の能力を過大評価しやすく、能力が高い人ほど自分の能力を過小評価しやすい傾向を何という？", "a": "ダニング＝クルーガー効果", "choices": ["ダニング＝クルーガー効果", "ピグマリオン効果", "ハロー効果", "スポットライト効果"], "explain": "能力や知識が不足していると、自分の能力不足そのものを認識しにくいことがあります。"}, {"q": "実際以上に、周囲の人が自分の外見や行動に注目していると思ってしまう傾向を何という？", "a": "スポットライト効果", "choices": ["スポットライト効果", "傍観者効果", "ツァイガルニク効果", "プラセボ効果"], "explain": "自分が周囲から注目されている度合いを、実際より大きく見積もる傾向です。"}, {"q": "薬理作用のない偽薬でも、「効く」と信じることで症状が改善することがある現象を何という？", "a": "プラセボ効果", "choices": ["プラセボ効果", "ノセボ効果", "ハロー効果", "フレーミング効果"], "explain": "薬そのものの成分ではなく、効くという期待や信念などによって改善が生じる現象です。"}, {"q": "緊急事態で、その場にいる人数が多いほど、誰も助けようとしなくなる傾向を何という？", "a": "傍観者効果", "choices": ["傍観者効果", "単純接触効果", "ピグマリオン効果", "ヴェブレン効果"], "explain": "周囲に他の人がいることで責任が分散し、援助行動が起こりにくくなることがあります。"}, {"q": "高価であること自体が商品の魅力やステータスを高め、需要につながることがある現象を何という？", "a": "ヴェブレン効果", "choices": ["ヴェブレン効果", "フレーミング効果", "ツァイガルニク効果", "ハロー効果"], "explain": "価格が高いことそのものが、威信やステータスの象徴として商品の魅力になる場合があります。"}, {"q": "悪い知らせを聞いた後に、さらに悪い出来事を予想しやすくなるなど、最初の印象が後の判断に影響する現象を説明する代表的な概念は？", "a": "アンカリング効果", "choices": ["アンカリング効果", "単純接触効果", "傍観者効果", "プラセボ効果"], "explain": "最初に与えられた数値や情報が、その後の判断の基準として強く残る現象です。"}, {"q": "最初に提示された数字などを基準にして、その後の判断を大きく左右される現象を何という？", "a": "アンカリング効果", "choices": ["アンカリング効果", "ハロー効果", "スポットライト効果", "ヴェブレン効果"], "explain": "最初の情報（アンカー）が、その後の推定や判断を引っ張る現象です。"}, {"q": "「持っているものを手放したくない」という気持ちによって、所有物を実際以上に高く評価しやすくなる現象を何という？", "a": "保有効果", "choices": ["保有効果", "カクテルパーティー効果", "ピグマリオン効果", "フレーミング効果"], "explain": "自分が所有しているというだけで、その物の価値を高く感じやすくなる現象です。"}, {"q": "自分が選んだ選択肢を、選択後に実際以上に好ましく評価しやすくなる傾向を何という？", "a": "選択支持バイアス", "choices": ["選択支持バイアス", "傍観者効果", "単純接触効果", "ノセボ効果"], "explain": "自分の選択を正当化するように、選んだものをより良く評価しやすくなる傾向です。"}, {"q": "自分の持っている情報や知識が、他人にも当然共有されていると思い込む傾向を何という？", "a": "知識の呪い", "choices": ["知識の呪い", "スポットライト効果", "プラセボ効果", "ヴェブレン効果"], "explain": "自分が知っていることを知らない状態を想像するのが難しくなる認知バイアスです。"}, {"q": "自分の成功は自分の能力によるもの、失敗は外的要因によるものと考えやすい傾向を何という？", "a": "自己奉仕バイアス", "choices": ["自己奉仕バイアス", "ハロー効果", "アンカリング効果", "ツァイガルニク効果"], "explain": "成功を自分の内的要因、失敗を外的要因に帰属しやすい傾向です。"}, {"q": "自分と似た特徴を持つ人に対して、より好意的な評価をしやすい傾向を何という？", "a": "類似性効果", "choices": ["類似性効果", "単純接触効果", "保有効果", "傍観者効果"], "explain": "価値観や性格などが自分と似ている相手に親近感を抱きやすい傾向です。"}, {"q": "ある集団の大多数が支持していると知ることで、自分もその意見に同調しやすくなる現象を何という？", "a": "バンドワゴン効果", "choices": ["バンドワゴン効果", "プラセボ効果", "ピグマリオン効果", "スポットライト効果"], "explain": "「みんなが支持している」という情報によって、さらに支持が集まりやすくなる現象です。"}, {"q": "少数派の商品や珍しいものを、希少であることを理由に魅力的に感じやすくなる現象を何という？", "a": "スノッブ効果", "choices": ["スノッブ効果", "ヴェブレン効果", "ハロー効果", "フレーミング効果"], "explain": "他人が持っていない希少性に価値を感じ、差別化したくなる心理です。"}, {"q": "「残りわずか」「期間限定」など、入手しにくくなると欲しくなりやすい心理を何という？", "a": "希少性効果", "choices": ["希少性効果", "単純接触効果", "ダニング＝クルーガー効果", "選択支持バイアス"], "explain": "手に入りにくいものほど価値が高いと感じやすくなる心理です。"}, {"q": "一度大きな要求を断らせた後、より小さな要求を出すと承諾されやすくなる方法を何という？", "a": "ドア・イン・ザ・フェイス", "choices": ["ドア・イン・ザ・フェイス", "フット・イン・ザ・ドア", "返報性の原理", "ハロー効果"], "explain": "最初に大きな要求を提示し、断られた後で小さな要求を出すことで承諾率を高める方法です。"}, {"q": "最初に小さな要求を受け入れてもらうと、その後の大きな要求も受け入れてもらいやすくなる現象を何という？", "a": "フット・イン・ザ・ドア", "choices": ["フット・イン・ザ・ドア", "ドア・イン・ザ・フェイス", "バンドワゴン効果", "保有効果"], "explain": "小さな依頼から始めて、徐々に大きな依頼へつなげる方法です。"}, {"q": "何かをしてもらったら、お返しをしなければならないと感じやすい心理を何という？", "a": "返報性の原理", "choices": ["返報性の原理", "希少性効果", "知識の呪い", "スポットライト効果"], "explain": "人から恩恵を受けると、それに応えようとする心理が働きやすくなります。"}, {"q": "自分の考えと矛盾する情報に出会ったとき、不快感を減らすために考えや行動を変化させることを説明する概念は？", "a": "認知的不協和", "choices": ["認知的不協和", "ハロー効果", "単純接触効果", "傍観者効果"], "explain": "認知同士の矛盾による不快感を減らすため、人は考えや行動を調整することがあります。"}, {"q": "一度失敗したことで、その後も失敗すると考えてしまい、挑戦を避けるようになる状態を説明する代表的な概念は？", "a": "学習性無力感", "choices": ["学習性無力感", "ピグマリオン効果", "アンカリング効果", "ヴェブレン効果"], "explain": "自分では結果を変えられない経験が続くと、努力しても無駄だと学習してしまうことがあります。"}, {"q": "自分の予想や信念に合う情報ばかりを集め、反対の情報を無視しやすい傾向を何という？", "a": "確証バイアス", "choices": ["確証バイアス", "単純接触効果", "保有効果", "プラセボ効果"], "explain": "自分の仮説を支持する情報を選択的に集めたり重視したりする傾向です。"}, {"q": "人は自分の身近な人や自分自身に起きる出来事を、他人よりも起こりやすいと感じることがある。この傾向に近いものは？", "a": "利用可能性ヒューリスティック", "choices": ["利用可能性ヒューリスティック", "ハロー効果", "返報性の原理", "スノッブ効果"], "explain": "思い出しやすい情報を手がかりに、出来事の起こりやすさを判断する傾向です。"}, {"q": "一度覚えた情報を思い出す際、最初に覚えた項目が記憶に残りやすい現象を何という？", "a": "初頭効果", "choices": ["初頭効果", "新近効果", "ツァイガルニク効果", "プラセボ効果"], "explain": "列挙された情報の最初のほうが記憶に残りやすい傾向です。"}, {"q": "一度覚えた情報を思い出す際、最後に提示された項目が記憶に残りやすい現象を何という？", "a": "新近効果", "choices": ["新近効果", "初頭効果", "ハロー効果", "傍観者効果"], "explain": "列挙された情報の最後のほうが記憶に残りやすい傾向です。"}, {"q": "人は「自分は平均より優れている」と考えやすい傾向を何という？", "a": "平均以上効果", "choices": ["平均以上効果", "ダニング＝クルーガー効果", "バンドワゴン効果", "保有効果"], "explain": "多くの人が自分の能力や性格を平均より良いと評価しやすい傾向です。"}, {"q": "自分に都合のよい情報は信じやすく、都合の悪い情報には批判的になりやすい傾向を何という？", "a": "動機づけられた推論", "choices": ["動機づけられた推論", "アンカリング効果", "単純接触効果", "スポットライト効果"], "explain": "望ましい結論にたどり着きたいという動機が、情報の解釈に影響することがあります。"}, {"q": "人は物事が起こった後に、「最初から結果を予測できていた」と感じやすい。この傾向を何という？", "a": "後知恵バイアス", "choices": ["後知恵バイアス", "ハロー効果", "希少性効果", "プラセボ効果"], "explain": "結果を知った後では、その結果が予測可能だったように感じてしまう傾向です。"}, {"q": "自分が選択したものに対して、選択肢が少なかった場合よりも、選択肢が多かった場合に満足度が下がることがある。この現象に関係する概念は？", "a": "選択のパラドックス", "choices": ["選択のパラドックス", "ピグマリオン効果", "スノッブ効果", "初頭効果"], "explain": "選択肢が増えすぎると比較や後悔が増え、かえって満足しにくくなることがあります。"}, {"q": "他人から評価されることで、自分の行動や能力についての自己評価まで変化することがある。この現象に関係する代表的な効果は？", "a": "ラベリング効果", "choices": ["ラベリング効果", "傍観者効果", "ヴェブレン効果", "ツァイガルニク効果"], "explain": "人から貼られた評価・ラベルが、その人自身の認識や行動に影響することがあります。"}, {"q": "人は一度投資した時間やお金を無駄にしたくないため、合理的にはやめるべきことでも続けてしまうことがある。これは何と呼ばれる？", "a": "サンクコスト効果", "choices": ["サンクコスト効果", "単純接触効果", "プラセボ効果", "フレーミング効果"], "explain": "すでに回収できない過去の投資に引きずられ、追加投資を続けてしまう現象です。"}, {"q": "一度ある価格を見せられると、その後の商品価格の評価がその価格に引っ張られる現象を何という？", "a": "アンカリング効果", "choices": ["アンカリング効果", "ハロー効果", "バンドワゴン効果", "返報性の原理"], "explain": "最初に提示された価格が基準点となり、その後の価格判断に影響します。"}, {"q": "「無料」という言葉が付くと、価格差以上に魅力を強く感じやすくなる現象を説明する代表的な概念は？", "a": "ゼロ価格効果", "choices": ["ゼロ価格効果", "ヴェブレン効果", "保有効果", "スポットライト効果"], "explain": "無料には通常の価格差以上の心理的な魅力が生じやすいとされます。"}, {"q": "自分が大切にしているものを失う苦痛を、同じ価値のものを得る喜びよりも強く感じやすい傾向を何という？", "a": "損失回避", "choices": ["損失回避", "単純接触効果", "ピグマリオン効果", "新近効果"], "explain": "同じ大きさなら、利益より損失の心理的影響を強く感じやすい傾向です。"}, {"q": "ある行動をした直後に報酬が与えられると、その行動が繰り返されやすくなることを説明する学習原理は？", "a": "強化", "choices": ["強化", "ハロー効果", "フレーミング効果", "ツァイガルニク効果"], "explain": "行動の直後に報酬などが与えられると、その行動が増えやすくなります。"}, {"q": "周囲の人の行動を見て、自分も同じ行動を取りやすくなる現象を何という？", "a": "同調効果", "choices": ["同調効果", "保有効果", "プラセボ効果", "希少性効果"], "explain": "集団の判断や行動に合わせて、自分の判断や行動を変えることがあります。"}, {"q": "周囲の人が自分と同じように行動しているのを見ると、その行動が正しいと思いやすくなる心理を何という？", "a": "社会的証明", "choices": ["社会的証明", "アンカリング効果", "知識の呪い", "選択支持バイアス"], "explain": "他人の行動を「正しい行動の手がかり」として利用する心理です。"}, {"q": "ある人の一つの魅力的な特徴が、その人の他の特徴の評価まで高める現象を何という？", "a": "ハロー効果", "choices": ["ハロー効果", "単純接触効果", "傍観者効果", "ノセボ効果"], "explain": "外見・肩書き・能力など一つの目立つ特徴が、人物全体の評価に波及します。"}, {"q": "「悪いことが起きそう」と強く信じることで、実際に不調などが生じることがある。この現象を何という？", "a": "ノセボ効果", "choices": ["ノセボ効果", "プラセボ効果", "ピグマリオン効果", "ヴェブレン効果"], "explain": "否定的な期待や思い込みによって、実際に症状などが悪化することがあります。"}, {"q": "ある選択肢を見慣れているほど、それを自然で正しいものだと感じやすくなる現象に近いものは？", "a": "単純接触効果", "choices": ["単純接触効果", "損失回避", "サンクコスト効果", "ドア・イン・ザ・フェイス"], "explain": "繰り返し接触することで親近感が増し、好意的に評価しやすくなります。"}, {"q": "人は自分の行動を決めた後、その行動と矛盾する考えを持ち続けることを避けようとする。この心理を説明する概念は？", "a": "認知的不協和", "choices": ["認知的不協和", "平均以上効果", "スノッブ効果", "新近効果"], "explain": "自分の行動と信念の食い違いによる不快感を減らすため、考え方を調整することがあります。"}, {"q": "高い目標を設定した人ほど、適切な条件では高い成果を上げやすくなることを説明する考え方に関係するのは？", "a": "目標設定効果", "choices": ["目標設定効果", "傍観者効果", "ハロー効果", "ゼロ価格効果"], "explain": "明確で適度に難しい目標は、努力や注意を方向づけ、成果を高めることがあります。"}, {"q": "「自分だけは事故に遭わない」など、自分には悪い出来事が起こりにくいと考える傾向を何という？", "a": "楽観バイアス", "choices": ["楽観バイアス", "損失回避", "ツァイガルニク効果", "保有効果"], "explain": "自分にとって望ましい結果が起こる可能性を高く、悪い結果を低く見積もる傾向です。"}, {"q": "自分が知っている答えを、相手も知っているはずだと考えてしまう傾向に関係する概念は？", "a": "知識の呪い", "choices": ["知識の呪い", "社会的証明", "希少性効果", "プラセボ効果"], "explain": "知識を持った後では、知らない人の視点を想像しにくくなることがあります。"}, {"q": "ある出来事について、最近見聞きした具体的な例を思い出し、その出来事が頻繁に起きると判断するのは何の影響？", "a": "利用可能性ヒューリスティック", "choices": ["利用可能性ヒューリスティック", "ハロー効果", "返報性の原理", "ピグマリオン効果"], "explain": "思い出しやすさを、発生確率の判断材料として使う傾向です。"}, {"q": "「この商品は残り1個」と表示されると、通常より欲しく感じやすくなる現象を何という？", "a": "希少性効果", "choices": ["希少性効果", "単純接触効果", "フット・イン・ザ・ドア", "ダニング＝クルーガー効果"], "explain": "入手可能性が低いと感じることで、対象の価値や欲しさが高まることがあります。"}];
let questions=[],current=0,score=0;

function shuffle(arr){
  const copy=[...arr];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function startQuiz(){
  // 50問の問題プールから10問をランダム抽出
  questions=shuffle(questionBank).slice(0,10).map(q=>({...q,choices:shuffle(q.choices)}));
  current=0;score=0;showQuestion();
}

function showQuestion(){
  const q=questions[current],app=document.getElementById("app");
  app.innerHTML=`
    <h1>「〜効果」4択クイズ</h1>
    <div class="subtitle">50問の問題プールから毎回10問をランダム出題</div>
    <div class="progress">第 ${current+1} 問 / 10問</div>
    <div class="question">${q.q}</div>
    <div id="choices"></div><div id="feedback"></div>`;
  const choicesEl=document.getElementById("choices");
  q.choices.forEach((choice,index)=>{
    const button=document.createElement("button");
    button.className="option";
    button.textContent=`${String.fromCharCode(65+index)}. ${choice}`;
    button.onclick=()=>answer(choice,button);
    choicesEl.appendChild(button);
  });
}

function answer(choice,clickedButton){
  const q=questions[current],buttons=document.querySelectorAll(".option");
  buttons.forEach(b=>b.disabled=true);
  const isCorrect=choice===q.a;
  if(isCorrect){score++;clickedButton.classList.add("correct")}
  else{
    clickedButton.classList.add("wrong");
    buttons.forEach(b=>{if(b.textContent.includes(q.a))b.classList.add("correct")});
  }
  document.getElementById("feedback").innerHTML=`
    <div class="feedback">
      <strong>${isCorrect?"⭕ 正解！":"❌ 不正解"}</strong><br>
      正解：<strong>${q.a}</strong><br><br>${q.explain}
    </div>
    <button class="next" onclick="nextQuestion()">${current===9?"結果を見る":"次の問題"}</button>`;
}

function nextQuestion(){current++;current>=10?showResult():showQuestion()}

function showResult(){
  const app=document.getElementById("app");
  const message=score===10?"全問正解！すごい！":score>=8?"かなり詳しい！":score>=6?"いい感じ！":score>=4?"もう一歩！":"ここから覚えていこう！";
  app.innerHTML=`
    <div class="result">
      <h1>結果発表</h1><div class="score">${score} / 10</div><p>${message}</p>
      <p class="small">「もう一度挑戦」で、50問の中からまた10問がランダムに選ばれます。<br>選択肢の順番も毎回変わります。</p>
      <button class="restart" onclick="startQuiz()">もう一度ランダム出題</button>
    </div>`;
}
startQuiz();
</script>
